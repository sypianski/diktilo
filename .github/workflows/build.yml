name: Build Diktilo.app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # whisper.xcframework build takes ~15 min; cache it between runs.
      - name: Cache whisper.xcframework
        uses: actions/cache@v4
        with:
          path: ~/VoiceInk-Dependencies
          key: whisper-xcframework-${{ runner.os }}-v1

      # LLMkit needs Swift tools 6.2+; the image default Xcode is older.
      - name: Select latest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          echo "Selecting $XCODE"
          sudo xcode-select -s "$XCODE"
          swift --version

      - name: Build (local, ad-hoc signed)
        run: make local

      - name: Zip app
        run: |
          cd .local-build/Build/Products/Debug
          ditto -c -k --sequesterRsrc --keepParent Diktilo.app Diktilo.app.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Diktilo-app
          path: .local-build/Build/Products/Debug/Diktilo.app.zip
          retention-days: 14
